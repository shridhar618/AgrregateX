name: agrregatex
services:
  postgres:
    image: ghcr.io/trickle-labs/pg_trickle@sha256:92f271e27f8d3b9b5aaf568df10ee377937f48d79825e73adaf469768b0208a5
    environment:
      POSTGRES_USER: agrregatex_owner
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Run scripts/setup.sh}
      POSTGRES_DB: agrregatex
      API_DB_PASSWORD: ${API_DB_PASSWORD}
    command: [postgres, -c, shared_preload_libraries=, -c, shared_buffers=128MB, -c, work_mem=4MB, -c, maintenance_work_mem=64MB, -c, max_connections=32, -c, max_parallel_workers_per_gather=0, -c, max_wal_size=2GB, -c, track_commit_timestamp=on]
    mem_limit: 1800m
    cpus: 1.5
    ports: ["127.0.0.1:25432:5432"]
    volumes:
      - data:/var/lib/postgresql
      - ./database:/agrregatex:ro,Z
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/01-agrregatex.sh:ro,Z
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U agrregatex_owner -d agrregatex"]
      interval: 2s
      timeout: 5s
      retries: 60
    restart: unless-stopped
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://agrregatex_api:${API_DB_PASSWORD}@postgres/agrregatex
    mem_limit: 300m
    cpus: 0.75
    ports: ["127.0.0.1:18081:8000"]
    volumes:
      - ./.secrets.json:/app/secrets.json:ro,Z
      - ./benchmarks/results:/app/results:ro,Z
    depends_on:
      postgres: {condition: service_healthy}
    restart: unless-stopped
volumes:
  data:
