<!doctype html><html lang="en"><meta charset="utf-8"><title>AgrregateX</title><style>body{font:16px system-ui;max-width:1000px;margin:40px auto;background:#101725;color:#e4edf7}input,button{padding:9px;margin:5px}pre{white-space:pre-wrap;background:#1b2839;padding:20px}a{color:#79c8ff}</style><h1>AgrregateX</h1><p>Multi-Tenant Real-Time Aggregation Layer · <a href="/docs">API documentation</a></p><p>Tenant identity is validated by the server. Tokens stay in this page's memory.</p><input id="tenant" type="number" value="1" aria-label="Tenant"><input id="token" type="password" placeholder="Tenant API token" aria-label="Token"><input id="start" value="2026-09-01T00:00:00Z" aria-label="From"><input id="end" value="2026-11-01T00:00:00Z" aria-label="To"><button onclick="load()">Query live data</button><div id="results"></div><script>
async function load(){const target=document.getElementById('results');target.replaceChildren();for(const family of ['summary','trends','top-products','breakdown','freshness']){const h=document.createElement('h2');h.textContent=family;const pre=document.createElement('pre');target.append(h,pre);try{const t=performance.now();const u='/tenants/'+document.getElementById('tenant').value+'/'+family+'?from='+encodeURIComponent(document.getElementById('start').value)+'&to='+encodeURIComponent(document.getElementById('end').value);const r=await fetch(u,{headers:{Authorization:'Bearer '+document.getElementById('token').value}});pre.textContent=JSON.stringify({http:r.status,elapsed_ms:Math.round(performance.now()-t),response:await r.json()},null,2)}catch(e){pre.textContent=e.message}}}
</script></html>
